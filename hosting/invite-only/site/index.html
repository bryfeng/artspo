<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Artbook studio</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root {
    --bg: #fbfaf7; --surface: #ffffff; --ink: #17161a; --muted: #6e6b73; --line: #e6e3dc;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --r: 8px; --r-xl: 16px; --t: 160ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141417; --surface: #1c1c20; --ink: #eeece6; --muted: #94919a; --line: #2c2c31; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--sans); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 56px 20px 80px; }
  header { display: flex; align-items: center; gap: 12px; }
  header img { width: 28px; height: 28px; border-radius: 7px; }
  h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  .lede { margin: 20px 0 36px; color: var(--muted); max-width: 60ch; }
  .label { font: 500 12px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  a.book { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 18px 20px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r-xl); color: inherit; text-decoration: none; transition: border-color var(--t), transform var(--t); }
  a.book:hover { border-color: var(--muted); }
  a.book:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .book b { font-weight: 600; font-size: 17px; }
  .book span { grid-column: 1; color: var(--muted); }
  .book time { grid-row: 1; grid-column: 2; font: 12px/1.8 var(--mono); color: var(--muted); }
  footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
  footer a { color: inherit; }
</style>
<body>
<div class="wrap">
  <header><img src="icon.png" alt=""><h1>Artbook studio</h1></header>
  <p class="lede">Work in progress, shared with you directly. Please don't forward these links: anyone else will be asked to sign in and turned away.</p>
  <p class="label">Books</p>
  <ul>
    <!-- One <li> per book. Agents: add or update the book you just published, newest first. -->
  </ul>
  <footer>Made with <a href="https://artbook.dev">Artspo</a>.</footer>
</div>
</body>
</html>
