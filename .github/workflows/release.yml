# Push a tag like v0.7.2 and this builds the zips with package.sh and publishes them as a GitHub Release.
# The tag must match "version" in extension/manifest.json.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the manifest
        run: |
          V=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          [ "${GITHUB_REF_NAME}" = "v$V" ] || { echo "Tag ${GITHUB_REF_NAME} but manifest says $V"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Build
        run: sh package.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=".github/release-notes/v$V.md"
          if [ -f "$NOTES" ]; then ARGS="--notes-file $NOTES"; else ARGS="--generate-notes"; fi
          gh release create "$GITHUB_REF_NAME" "dist/artspo-$V.zip" "dist/artspo-extension-$V.zip" \
            --title "Artspo $V: clip the web's best design for your AI agent" $ARGS
